[package]
name = "cctag-rs"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust port of the CCTag (concentric circles fiducial marker) CPU detection pipeline"
license = "MPL-2.0"

[lib]
name = "cctag"
path = "src/lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
png = ["dep:image"]
xml = ["dep:quick-xml"]
refdata = []
synth = []

[dependencies]
rayon = { version = "1.10", optional = true }
thiserror = "2"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
quick-xml = { version = "0.37", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"
nalgebra = "0.33"
rand_pcg = "0.3"
rand_core = "0.6"
proptest = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.bench]
inherits = "release"

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "stages"
harness = false
